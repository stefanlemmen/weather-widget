<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>Weather Widget in plain HTML</title>
    <meta
      name="description"
      content="Weather Widgets on a plain HTML page with no framework, loaded from one standalone ES module."
    />
    <link
      rel="canonical"
      href="https://weather-widget-ruby-delta.vercel.app/vanilla/"
    />
    <link rel="icon" href="data:," />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Weather Widget in plain HTML" />
    <meta
      property="og:description"
      content="Weather Widgets on a plain HTML page with no framework, loaded from one standalone ES module."
    />
    <meta
      property="og:url"
      content="https://weather-widget-ruby-delta.vercel.app/vanilla/"
    />
    <link
      rel="preload"
      href="/fonts/lexend-latin-wght.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <style>
      @font-face {
        font-family: "Lexend";
        font-style: normal;
        font-weight: 400 800;
        font-display: swap;
        src: url("/fonts/lexend-latin-wght.woff2") format("woff2");
        unicode-range:
          U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC,
          U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193,
          U+2212, U+2215, U+FEFF, U+FFFD;
      }

      :root {
        --page-max-size: 72rem;
        --page-gap: 2rem;
        --caption-gap: 0.75rem;
        --example-min-size: 18rem;
        font-family: "Lexend", system-ui, sans-serif;
        line-height: 1.4;
      }

      body {
        margin: 0;
        background-color: Canvas;
        color: CanvasText;
      }

      main {
        box-sizing: border-box;
        max-inline-size: var(--page-max-size);
        margin-inline: auto;
        padding: clamp(1.5rem, 5vw, 3rem) clamp(1rem, 4vw, 2rem);
        display: grid;
        gap: var(--page-gap);
      }

      h1 {
        margin: 0;
        font-size: clamp(1.75rem, 1.25rem + 2vw, 2.5rem);
        font-weight: 800;
        line-height: 1.15;
        text-wrap: balance;
      }

      figure {
        margin: 0;
        display: grid;
        align-content: start;
        gap: var(--caption-gap);
      }

      figure > * {
        min-inline-size: 0;
      }

      main:has(
          weather-widget:not(:defined),
          weather-location-picker:not(:defined)
        )
        figure {
        display: none;
      }

      figcaption {
        color: color-mix(in oklab, CanvasText 72%, Canvas);
      }

      code {
        font-family: ui-monospace, monospace;
        font-size: 0.9em;
      }

      .examples {
        display: grid;
        grid-template-columns: repeat(
          auto-fit,
          minmax(min(100%, var(--example-min-size)), 1fr)
        );
        gap: var(--page-gap);
      }
    </style>
    <script type="module" src="/widget/weather-widget.js" vite-ignore></script>
    <script
      type="module"
      src="/location-picker/weather-location-picker.js"
      vite-ignore
    ></script>
    <script type="module">
      const chosen = document.querySelector("#chosen-location");
      document
        .querySelector("weather-location-picker")
        .addEventListener("location-select", ({ detail }) => {
          chosen.latitude = detail.latitude;
          chosen.longitude = detail.longitude;
          chosen.locationName = detail.name ?? undefined;
        });
    </script>
  </head>
  <body>
    <main>
      <h1>Weather Widget in plain HTML</h1>
      <figure>
        <figcaption>Choose a Location to show it in this Widget.</figcaption>
        <weather-location-picker></weather-location-picker>
        <weather-widget
          id="chosen-location"
          latitude="52.03"
          longitude="5.08"
        ></weather-widget>
      </figure>
      <div class="examples">
        <figure>
          <figcaption>Dutch: <code>locale="nl"</code></figcaption>
          <weather-widget
            latitude="52.03"
            longitude="5.08"
            locale="nl"
          ></weather-widget>
        </figure>
        <figure>
          <figcaption>Imperial units: <code>units="imperial"</code></figcaption>
          <weather-widget
            latitude="52.03"
            longitude="5.08"
            units="imperial"
          ></weather-widget>
        </figure>
        <figure>
          <figcaption>Themed with five CSS custom properties</figcaption>
          <weather-widget
            latitude="52.03"
            longitude="5.08"
            style="
              --weather-font: Georgia, serif;
              --weather-background: #fffaf2;
              --weather-ink: #2b1d16;
              --weather-accent: #9c3412;
              --weather-radius: 0;
            "
          ></weather-widget>
        </figure>
      </div>
    </main>
  </body>
</html>
