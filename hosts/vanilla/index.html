<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>Weather Widget in plain HTML</title>
    <meta
      name="description"
      content="Try the Weather Widget's settings on a plain HTML page with no framework, loaded from one standalone ES module."
    />
    <link
      rel="canonical"
      href="https://weather-widget-ruby-delta.vercel.app/vanilla/"
    />
    <link rel="icon" href="data:," />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Weather Widget in plain HTML" />
    <meta
      property="og:description"
      content="Try the Weather Widget's settings on a plain HTML page with no framework, loaded from one standalone ES module."
    />
    <meta
      property="og:url"
      content="https://weather-widget-ruby-delta.vercel.app/vanilla/"
    />
    <style>
      :root {
        font-family: system-ui, sans-serif;
        line-height: 1.4;
      }

      body {
        margin: 0;
        background-color: Canvas;
        color: CanvasText;
      }

      main {
        box-sizing: border-box;
        max-inline-size: 52rem;
        margin-inline: auto;
        padding: clamp(1.5rem, 5vw, 3rem) clamp(1rem, 4vw, 2rem);
        display: grid;
        grid-template-columns: minmax(0, 1fr);
        gap: 2rem;
      }

      main > * {
        min-inline-size: 0;
      }

      weather-widget {
        max-inline-size: 100%;
      }

      main:has(
          weather-widget:not(:defined),
          weather-location-picker:not(:defined)
        )
        > :not(h1) {
        visibility: hidden;
      }

      h1 {
        margin: 0;
        font-size: clamp(1.75rem, 1.25rem + 2vw, 2.5rem);
        line-height: 1.15;
        text-wrap: balance;
      }

      form {
        margin: 0;
        display: grid;
        gap: 0.75rem;
      }

      h2,
      #forecast-parts-hint {
        margin: 0;
        font-size: 1.25rem;
      }

      label {
        white-space: nowrap;
      }

      summary h2 {
        display: inline;
      }

      details[open] > summary {
        margin-block-end: 0.75rem;
      }

      @media (min-width: 64rem) {
        :root {
          --settings-inset: 1rem;
          --settings-inline-size: 18rem;
        }

        body:has(details[open]) {
          padding-inline-end: calc(
            var(--settings-inline-size) + 2 * var(--settings-inset)
          );
        }

        details {
          box-sizing: border-box;
          position: fixed;
          inset-block-start: var(--settings-inset);
          inset-inline-end: var(--settings-inset);
          max-block-size: calc(100dvh - 2 * var(--settings-inset));
          overflow-y: auto;
          background-color: Canvas;
        }

        details[open] {
          inline-size: var(--settings-inline-size);
        }
      }
    </style>
    <script type="module" src="/widget/weather-widget.js" vite-ignore></script>
    <script
      type="module"
      src="/location-picker/weather-location-picker.js"
      vite-ignore
    ></script>
    <script type="module">
      const FORECAST_PARTS_HINT =
        "The Widget always shows at least one Forecast part.";
      const THEMED_PRESET_STYLE = [
        "--weather-font: Georgia, serif",
        "--weather-background: light-dark(#fffaf2, #211814)",
        "--weather-ink: light-dark(#2b1d16, #f6ede2)",
        "--weather-accent: light-dark(#9c3412, #f0936a)",
        "--weather-radius: 0",
      ];
      const STYLE_SETTINGS = ["width", "theme", "color-scheme"];
      const widget = document.querySelector("weather-widget");

      const setAttribute = (name, value) => {
        if (value) widget.setAttribute(name, value);
        else widget.removeAttribute(name);
      };

      const settings = document.querySelector("form");

      const partsHint = document.querySelector("#forecast-parts-hint");

      const setParts = (changedCheckbox) => {
        const checkboxes = [...settings.elements.parts];
        const ticked = checkboxes.filter((checkbox) => checkbox.checked);
        if (ticked.length === 0) {
          changedCheckbox.checked = true;
          partsHint.textContent = FORECAST_PARTS_HINT;
          return;
        }
        partsHint.textContent = "";
        setAttribute(
          "parts",
          ticked.length < checkboxes.length
            ? ticked.map((checkbox) => checkbox.value).join(" ")
            : "",
        );
      };

      const setStyle = () => {
        const { width, theme, "color-scheme": colorScheme } = settings.elements;
        setAttribute(
          "style",
          [
            `inline-size: ${width.value}px`,
            ...(theme.value ? THEMED_PRESET_STYLE : []),
            ...(colorScheme.value
              ? [`color-scheme: ${colorScheme.value}`]
              : []),
          ].join("; "),
        );
      };

      settings.addEventListener("change", ({ target }) => {
        if (target.name === "parts") setParts(target);
        else if (STYLE_SETTINGS.includes(target.name)) setStyle();
        else setAttribute(target.name, target.value);
      });

      document
        .querySelector("weather-location-picker")
        .addEventListener("location-select", ({ detail }) => {
          setAttribute("latitude", String(detail.latitude));
          setAttribute("longitude", String(detail.longitude));
          setAttribute("location-name", detail.name);
        });
    </script>
  </head>
  <body>
    <main>
      <h1>Weather Widget in plain HTML</h1>
      <details open>
        <summary><h2 id="widget-settings-title">Widget settings</h2></summary>
        <form aria-labelledby="widget-settings-title">
          <fieldset>
            <legend>Locale</legend>
            <label
              ><input type="radio" name="locale" value="" checked />
              English</label
            >
            <label><input type="radio" name="locale" value="nl" /> Dutch</label>
          </fieldset>
          <fieldset>
            <legend>Units</legend>
            <label
              ><input type="radio" name="units" value="" checked />
              Metric</label
            >
            <label
              ><input type="radio" name="units" value="imperial" />
              Imperial</label
            >
          </fieldset>
          <fieldset aria-describedby="forecast-parts-hint">
            <legend>Forecast parts</legend>
            <label
              ><input type="checkbox" name="parts" value="current" checked />
              Current conditions</label
            >
            <label
              ><input type="checkbox" name="parts" value="hourly" checked />
              Hourly forecast</label
            >
            <label
              ><input type="checkbox" name="parts" value="daily" checked />
              Daily forecast</label
            >
            <p id="forecast-parts-hint" role="status"></p>
          </fieldset>
          <fieldset>
            <legend>Theme</legend>
            <label
              ><input type="radio" name="theme" value="" checked /> None</label
            >
            <label
              ><input type="radio" name="theme" value="preset" /> Georgia and
              rust</label
            >
          </fieldset>
          <fieldset>
            <legend>Color scheme</legend>
            <label
              ><input type="radio" name="color-scheme" value="" checked />
              System</label
            >
            <label
              ><input type="radio" name="color-scheme" value="light" />
              Light</label
            >
            <label
              ><input type="radio" name="color-scheme" value="dark" />
              Dark</label
            >
          </fieldset>
          <fieldset>
            <legend>Width</legend>
            <label
              ><input type="radio" name="width" value="240" /> 240 pixels</label
            >
            <label
              ><input type="radio" name="width" value="390" checked /> 390
              pixels</label
            >
            <label
              ><input type="radio" name="width" value="640" /> 640 pixels</label
            >
            <label
              ><input type="radio" name="width" value="760" /> 760 pixels</label
            >
          </fieldset>
        </form>
      </details>
      <weather-location-picker></weather-location-picker>
      <weather-widget
        latitude="52.03"
        longitude="5.08"
        style="inline-size: 390px"
      ></weather-widget>
    </main>
  </body>
</html>
