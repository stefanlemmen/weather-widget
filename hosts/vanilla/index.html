<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>Weather Widget in plain HTML</title>
    <meta
      name="description"
      content="Weather Widgets on a plain HTML page with no framework, loaded from one standalone ES module."
    />
    <link
      rel="canonical"
      href="https://weather-widget-ruby-delta.vercel.app/vanilla/"
    />
    <link rel="icon" href="data:," />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Weather Widget in plain HTML" />
    <meta
      property="og:description"
      content="Weather Widgets on a plain HTML page with no framework, loaded from one standalone ES module."
    />
    <meta
      property="og:url"
      content="https://weather-widget-ruby-delta.vercel.app/vanilla/"
    />
    <link
      rel="preload"
      href="/fonts/lexend-latin-wght.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <style>
      @font-face {
        font-family: "Lexend";
        font-style: normal;
        font-weight: 400 800;
        font-display: swap;
        src: url("/fonts/lexend-latin-wght.woff2") format("woff2");
        unicode-range:
          U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC,
          U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193,
          U+2212, U+2215, U+FEFF, U+FFFD;
      }
    </style>
    <script type="module" src="/widget/weather-widget.js" vite-ignore></script>
    <script
      type="module"
      src="/widget/weather-location-picker.js"
      vite-ignore
    ></script>
    <script type="module">
      const chosen = document.querySelector("#chosen-location");
      document
        .querySelector("weather-location-picker")
        .addEventListener("location-select", ({ detail }) => {
          chosen.latitude = detail.latitude;
          chosen.longitude = detail.longitude;
          chosen.locationName = detail.name ?? undefined;
        });
    </script>
  </head>
  <body>
    <main>
      <h1>Weather Widget in plain HTML</h1>
      <weather-location-picker></weather-location-picker>
      <weather-widget
        id="chosen-location"
        latitude="52.03"
        longitude="5.08"
      ></weather-widget>
      <weather-widget
        latitude="52.03"
        longitude="5.08"
        locale="nl"
      ></weather-widget>
      <weather-widget
        latitude="52.03"
        longitude="5.08"
        units="imperial"
      ></weather-widget>
      <weather-widget
        latitude="52.03"
        longitude="5.08"
        style="
          --weather-font: Georgia, serif;
          --weather-background: #fffaf2;
          --weather-ink: #2b1d16;
          --weather-accent: #9c3412;
          --weather-radius: 0;
        "
      ></weather-widget>
    </main>
  </body>
</html>
