<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>Weather Widget in Angular</title>
    <meta
      name="description"
      content="Try the Weather Widget's settings in an Angular app that imports the Widget package and keeps the settings in signals."
    />
    <link
      rel="canonical"
      href="https://weather-widget-ruby-delta.vercel.app/angular/"
    />
    <link rel="icon" href="data:," />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Weather Widget in Angular" />
    <meta
      property="og:description"
      content="Try the Weather Widget's settings in an Angular app that imports the Widget package and keeps the settings in signals."
    />
    <meta
      property="og:url"
      content="https://weather-widget-ruby-delta.vercel.app/angular/"
    />
    <style>
      :root {
        font-family: system-ui, sans-serif;
        line-height: 1.4;
      }

      body {
        margin: 0;
        background-color: Canvas;
        color: CanvasText;
      }

      main {
        box-sizing: border-box;
        max-inline-size: 52rem;
        margin-inline: auto;
        padding: clamp(1.5rem, 5vw, 3rem) clamp(1rem, 4vw, 2rem);
        display: grid;
        grid-template-columns: minmax(0, 1fr);
        gap: 2rem;
      }

      main > * {
        min-inline-size: 0;
      }

      weather-widget {
        max-inline-size: 100%;
      }

      h1 {
        margin: 0;
        font-size: clamp(1.75rem, 1.25rem + 2vw, 2.5rem);
        line-height: 1.15;
        text-wrap: balance;
      }

      form {
        margin: 0;
        display: grid;
        gap: 0.75rem;
      }

      h2,
      #forecast-parts-hint {
        margin: 0;
        font-size: 1.25rem;
      }

      label {
        white-space: nowrap;
      }

      summary h2 {
        display: inline;
      }

      details[open] > summary {
        margin-block-end: 0.75rem;
      }

      @media (min-width: 64rem) {
        :root {
          --settings-inset: 1rem;
          --settings-inline-size: 18rem;
        }

        body:has(details[open]) {
          padding-inline-end: calc(
            var(--settings-inline-size) + 2 * var(--settings-inset)
          );
        }

        details {
          box-sizing: border-box;
          position: fixed;
          inset-block-start: var(--settings-inset);
          inset-inline-end: var(--settings-inset);
          max-block-size: calc(100dvh - 2 * var(--settings-inset));
          overflow-y: auto;
          background-color: Canvas;
        }

        details[open] {
          inline-size: var(--settings-inline-size);
        }
      }
    </style>
  </head>
  <body>
    <example-host></example-host>
  </body>
</html>
