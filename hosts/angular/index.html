    <style>
      :root {
        --page-max-size: 72rem;
        --page-gap: 2rem;
        --caption-gap: 0.75rem;
        --example-min-size: 18rem;
        font-family: system-ui, sans-serif;
        line-height: 1.4;
      }

      body {
        margin: 0;
        background-color: Canvas;
        color: CanvasText;
      }

      main {
        box-sizing: border-box;
        max-inline-size: var(--page-max-size);
        margin-inline: auto;
        padding: clamp(1.5rem, 5vw, 3rem) clamp(1rem, 4vw, 2rem);
        display: grid;
        gap: var(--page-gap);
      }

      h1 {
        margin: 0;
        font-size: clamp(1.75rem, 1.25rem + 2vw, 2.5rem);
        font-weight: 800;
        line-height: 1.15;
        text-wrap: balance;
      }

      figure {
        margin: 0;
        display: grid;
        align-content: start;
        gap: var(--caption-gap);
      }

      figure > * {
        min-inline-size: 0;
      }

      figcaption {
        color: color-mix(in oklab, CanvasText 72%, Canvas);
      }

      code {
        font-family: ui-monospace, monospace;
        font-size: 0.9em;
      }

      .examples {
        display: grid;
        grid-template-columns: repeat(
          auto-fit,
          minmax(min(100%, var(--example-min-size)), 1fr)
        );
        gap: var(--page-gap);
      }
    </style>
  </head>
